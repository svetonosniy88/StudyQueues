[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studyqueues"
version = "0.2.7"
description = "Local Markdown study queues and focus sessions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = ["PySide6==6.11.2"]

[project.urls]
Homepage = "https://github.com/svetonosniy88/StudyQueues"
Repository = "https://github.com/svetonosniy88/StudyQueues"
Issues = "https://github.com/svetonosniy88/StudyQueues/issues"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["studyqueues"]

[tool.setuptools.package-data]
studyqueues = ["theme.qss", "check.svg", "app.svg", "app.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
