name: Сообщить об ошибке
description: Что работает неправильно и как это повторить.
title: '[Ошибка] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Что произошло?
      description: Опишите результат и то, что ожидали увидеть.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: '1. Открыть обзор…'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Версия приложения и Windows
      placeholder: 'StudyQueues 0.2.7, Windows 11, масштаб 150%'
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Скриншот или текст ошибки
      description: Используйте демонстрационные задачи; не прикладывайте личные очереди, историю и токены доступа.
